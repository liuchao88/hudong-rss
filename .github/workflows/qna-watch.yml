name: qna-watch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并生成 RSS
        run: python scripts/fetch_qna.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/rss.xml state.json keywords.txt
          git diff --cached --quiet || git commit -m "update feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物（用当前工作区，即刚更新的 feed/）
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed/

      - name: 部署 Pages
        uses: actions/deploy-pages@v4
        id: deployment
