name: update-keywords

# 每周让大模型从互动问答语料里给 AI_KEYWORDS.json 补几个新词。
# 只加词、不删词；任何失败都不改文件（脚本里已做兜底）。
# 想立刻跑一次：Actions → update-keywords → Run workflow。

on:
  schedule:
    - cron: '0 2 * * 1'        # 每周一 10:00 北京时间（GitHub cron 用 UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keywords
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 让模型补词
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}   # 可选：配了就把周报推到企微群；不配就只写文件
        run: python scripts/update_keywords.py

      - name: 提交词库更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_KEYWORDS.json
          git diff --cached --quiet || git commit -m "AI keywords auto-update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true     # 抓取任务每 10 分钟也在提交，先对齐再推
          git push
